groups:
  - name: supabase_database_alerts
    interval: 60s
    rules:
      # Critical: Database is down
      - alert: PostgresDatabaseDown
        expr: pg_up == 0
        for: 5m
        labels:
          severity: critical
          service: supabase
        annotations:
          summary: "PostgreSQL database is down"
          description: "The database has been down for more than 5 minutes on {{ $labels.instance }}"

      # Warning: High replication lag
      - alert: PostgresReplicationLagHigh
        expr: (physical_replication_lag_physical_replication_lag_seconds > 600) and (rate(physical_replication_lag_physical_replication_lag_seconds[10m]) > 0)
        for: 5m
        labels:
          severity: warning
          service: supabase
        annotations:
          summary: "PostgreSQL replication lag is high and growing"
          description: "Replication lag is over 10 minutes and has been increasing for the last 10 minutes on {{ $labels.instance }}"

      # Warning: Database size growth
      - alert: PostgresDatabaseSizeGrowth
        expr: (pg_database_size_mb - pg_database_size_mb offset 12h) / pg_database_size_mb offset 12h * 100 > 20
        for: 5m
        labels:
          severity: warning
          service: supabase
        annotations:
          summary: "PostgreSQL database size growth exceeds threshold"
          description: "Database {{ $labels.instance }} has grown by more than 20% in the last 12 hours"

      # Critical: High disk usage
      - alert: HighDiskUsage
        expr: (pg_database_size_mb / 8192) * 100 > 80
        for: 10m
        labels:
          severity: critical
          service: supabase
        annotations:
          summary: "Disk usage is critically high"
          description: "Disk usage is above 80% on {{ $labels.instance }}"

      # Warning: High connection count
      - alert: HighConnectionCount
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
          service: supabase
        annotations:
          summary: "High number of database connections"
          description: "Connection count is {{ $value }} on {{ $labels.instance }}"

      # Warning: Long running transactions
      - alert: LongRunningTransactions
        expr: pg_stat_activity_max_tx_duration > 3600
        for: 5m
        labels:
          severity: warning
          service: supabase
        annotations:
          summary: "Long running transaction detected"
          description: "Transaction has been running for more than 1 hour on {{ $labels.instance }}"

      # Critical: Too many idle connections
      - alert: TooManyIdleConnections
        expr: pg_stat_database_numbackends{state="idle"} > 50
        for: 10m
        labels:
          severity: warning
          service: supabase
        annotations:
          summary: "Too many idle connections"
          description: "There are {{ $value }} idle connections on {{ $labels.instance }}"

      # Warning: High RAM usage
      - alert: HighRAMUsageWarning
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: supabase
        annotations:
          summary: "High RAM usage"
          description: "RAM usage is {{ $value | printf \"%.2f\" }}% on {{ $labels.instance }}"

      # Critical: Critically high RAM usage
      - alert: HighRAMUsageCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          service: supabase
        annotations:
          summary: "Critically high RAM usage"
          description: "RAM usage is {{ $value | printf \"%.2f\" }}% on {{ $labels.instance }}. System may become unstable."

