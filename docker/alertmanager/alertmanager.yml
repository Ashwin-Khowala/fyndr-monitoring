global:
  resolve_timeout: 5m

# Route configuration
route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  
  # Child routes
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    - match:
        severity: warning
      receiver: 'warning-alerts'

# Receivers configuration
receivers:
  - name: 'default-receiver'
    # Add your notification channels here
    # Example: email, slack, webhook, etc.
    
  - name: 'critical-alerts'
    # Configure critical alert notifications
    # Example for webhook:
    # webhook_configs:
    #   - url: 'http://your-webhook-url/critical'
    #     send_resolved: true
    
  - name: 'warning-alerts'
    # Configure warning alert notifications
    # Example for webhook:
    # webhook_configs:
    #   - url: 'http://your-webhook-url/warning'
    #     send_resolved: true

# Inhibition rules (prevent duplicate alerts)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
